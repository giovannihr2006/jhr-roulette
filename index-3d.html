<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JHR Quantum Roulette 3D - AAA Casino Experience</title>
    <link rel="icon" type="image/png" href="https://www.genspark.ai/api/files/s/m7ZXdmBM">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0a1f14 0%, #1a472a 100%);
            color: #ffffff;
            overflow: hidden;
        }
        
        #rouletteCanvas {
            display: block;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        #canvas3D {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }
        
        .info-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(20, 20, 30, 0.95);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            z-index: 1000;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }
        
        .version {
            color: #FFD700;
            font-weight: bold;
        }
        
        .mode-badge {
            background: rgba(255, 215, 0, 0.2);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            color: #FFD700;
            font-weight: bold;
        }
        
        .shortcuts {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .shortcuts span {
            margin: 0 10px;
        }
        
        .shortcuts kbd {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-family: monospace;
        }
        
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 31, 20, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .loading-screen.hidden {
            display: none;
        }
        
        .loading-screen h1 {
            color: #FFD700;
            font-size: 3em;
            margin-bottom: 20px;
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 215, 0, 0.3);
            border-top-color: #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
